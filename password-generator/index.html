<title>パスワード作成アプリ</title>
<style>

r:pointer}.hint{font-size:.76rem;color:var(--muted);margin:5px 0 0}.history{max-height:300px;overflow:auto}.history-list{list-style:none;margin:0;padding:0}.history-list li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}.history-list code{font:500 .88rem/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;min-width:0;flex:1}.history-list .btn{padding:6px 9px;min-height:36px;font-size:.8rem;flex-shrink:0}.danger{color:var(--red)}.empty{color:var(--muted);margin:12px 0}.notice{font-size:.78rem;color:var(--muted);margin:10px 0 0}.status{min-height:1.4em;font-size:.82rem;color:var(--green);margin:6px 0 0}.status.error{color:var(--red)}.modebar{display:flex;gap:8px;margin-bottom:12px}.modebar .btn{flex:1}.modebar .selected{background:var(--green);color:#fff;border-color:var(--green)}.checkline{display:flex;align-items:center;gap:7px;margin-top:12px;font-weight:600;flex-wrap:wrap}.checkline input{width:18px;height:18px;accent-color:var(--green)}select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:7px;font:inherit}[hidden]{display:none!important}@media(max-width:520px){.app{padding:10px}.panel{padding:12px;margin-bottom:9px}h1{font-size:1.15rem}.settings{gap:10px}.history{max-height:240px}.history-list code{font-size:.76rem}.history-list .btn{padding:6px 7px}header p{font-size:.75rem}}@media(prefers-color-scheme:dark){:root{--bg:#111914;--panel:#1c2820;--ink:#e9f2eb;--muted:#b2c3b7;--line:#35483a;--green:#3ab77e;--soft:#253d2d;--red:#ff9b9b}.primary{color:#102016}.btn:not(.primary){background:#24342a}}

.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.presets .btn{min-width:44px;padding:8px 10px;background:var(--panel)}
.presets .btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
</style><link rel="stylesheet" href="../navigation.css">
</head><body><main class="app">
<nav class="home-navigation" aria-label="サイトナビゲーション"><a class="home-link" href="../"><span aria-hidden="true">←</span>トップに戻る</a></nav>
<header><div class="mark" aria-hidden="true">🔐</div><div><h1>パスワード作成アプリ</h1><p>端末内で安全に生成。履歴は再読み込み・タブ終了で消えます。</p></div></header>
<div class="modebar" role="group" aria-label="生成方式"><button class="btn selected" id="modeRandom" type="button" aria-pressed="true">ランダム</button><button class="btn" id="modePhrase" type="button" aria-pressed="false">パスフレーズ</button></div>
<section class="panel"><div class="topline"><h2>生成したパスワード</h2><span class="sub" id="strength"></span></div><div id="password" class="password" aria-live="polite"></div><div class="actions"><button class="btn primary" id="generate">↻ 新しく生成</button><button class="btn" id="copy">コピー</button><button class="btn" id="toggle" aria-label="パスワードを隠す" aria-pressed="false">隠す</button></div><p class="status" id="status" role="status"></p></section>
<section class="panel"><div class="topline"><h2>生成設定</h2><span class="sub">変更後は「新しく生成」</span></div><div id="randomSettings"><div class="settings"><div class="setting"><label for="length">文字数 <input id="length" type="number" min="8" max="64" value="16" inputmode="numeric"></label><div class="presets" role="group" aria-label="文字数を選択"><button type="button" class="btn" data-setting="length" data-value="8" aria-pressed="false">8</button><button type="button" class="btn" data-setting="length" data-value="12" aria-pressed="false">12</button><button type="button" class="btn" data-setting="length" data-value="16" aria-pressed="false">16</button><button type="button" class="btn" data-setting="length" data-value="18" aria-pressed="false">18</button><button type="button" class="btn" data-setting="length" data-value="20" aria-pressed="false">20</button></div><input id="lengthRange" aria-label="文字数スライダー" type="range" min="8" max="64" value="16"><p class="hint">8〜64文字</p></div><div class="setting"><label for="symbols">記号の数 <input id="symbols" type="number" min="0" max="16" value="2" inputmode="numeric"></label><div class="presets" role="group" aria-label="記号の個数を選択"><button type="button" class="btn" data-setting="symbols" data-value="1" aria-pressed="false">1</button><button type="button" class="btn" data-setting="symbols" data-value="2" aria-pressed="false">2</button><button type="button" class="btn" data-setting="symbols" data-value="3" aria-pressed="false">3</button><button type="button" class="btn" data-setting="symbols" data-value="4" aria-pressed="false">4</button></div><input id="symbolsRange" aria-label="記号の数スライダー" type="range" min="0" max="16" value="2"><p class="hint" id="symbolsHint">0〜16個（正確に指定）</p></div></div><label class="checkline"><input type="checkbox" id="noAmbig"> 紛らわしい文字を除外する <span class="sub">（0/O、1/l/I など）</span></label><div style="margin-top:12px"><strong>使用する記号を選択</strong><div id="symbolGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div><button type="button" id="allSymbols" class="btn">全選択</button> <button type="button" id="noSymbols" class="btn">全解除</button><p id="symbolWarning" class="notice"></p></div></div><div id="phraseSettings" hidden><div class="settings"><div class="setting"><label for="wordCount">単語数 <input id="wordCount" type="number" min="3" max="8" value="6"></label><input id="wordRange" type="range" min="3" max="8" value="6" aria-label="単語数スライダー"><p class="hint">3〜8単語</p></div><div class="setting"><label for="separator">区切り文字</label><select id="separator"><option value="-">ハイフン（-）</option><option value="_">アンダースコア（_）</option><option value=".">ドット（.）</option><option value=" ">スペース</option><option value="">区切りなし</option></select></div></div><label class="checkline"><input type="checkbox" id="phraseNumber" checked> 末尾に数字（00〜99）を付ける</label><p class="notice">英単語を暗号学的に安全な乱数で選びます。数字が必要なサイトにも対応できます。</p></div></section>
<section class="panel"><div class="topline"><h2>生成履歴 <span class="sub" id="count"></span></h2><button class="btn danger" id="clear">履歴を全削除</button></div><div class="history"><ul id="history" class="history-list"></ul></div><p class="notice">履歴は最大30件。このタブのメモリ内だけに保持し、タブを閉じるかページを再読み込みすると消えます。コピーした内容はクリップボードに残る場合があります。</p></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',SYMBOLS='!@#$%^&*()-_=+',AMBIG='0O1lI',WORDS=['apple', 'river', 'cloud', 'mountain', 'ocean', 'forest', 'garden', 'window', 'summer', 'winter', 'spring', 'autumn', 'silver', 'golden', 'happy', 'simple', 'gentle', 'quiet', 'bright', 'clever', 'sunny', 'rainy', 'snowy', 'windy', 'table', 'chair', 'pencil', 'paper', 'bottle', 'coffee', 'music', 'piano', 'guitar', 'violin', 'trumpet', 'orange', 'banana', 'grape', 'lemon', 'peach', 'melon', 'cherry', 'berry', 'mango', 'kiwi', 'plum', 'fig', 'dog', 'cat', 'bird', 'fish', 'horse', 'sheep', 'rabbit', 'turtle', 'panda', 'koala', 'tiger', 'lion', 'zebra', 'sun', 'moon', 'star', 'sky', 'rain', 'snow', 'storm', 'thunder', 'rainbow', 'comet', 'planet', 'galaxy', 'book', 'story', 'poem', 'song', 'dance', 'dream', 'smile', 'laugh', 'peace', 'hope', 'love', 'friend', 'north', 'south', 'east', 'west', 'city', 'village', 'bridge', 'tower', 'castle', 'temple', 'market', 'park', 'green', 'blue', 'red', 'yellow', 'pink', 'purple', 'brown', 'white', 'black', 'gray', 'teal', 'coral', 'run', 'jump', 'swim', 'climb', 'walk', 'sing', 'read', 'write', 'cook', 'play', 'watch', 'listen', 'speak', 'morning', 'evening', 'night', 'dawn', 'dusk', 'today', 'tomorrow', 'season', 'weather', 'breeze', 'frost', 'stone', 'wood', 'iron', 'glass', 'silk', 'cotton', 'leather', 'marble', 'crystal', 'diamond', 'pearl', 'island', 'valley', 'canyon', 'desert', 'jungle', 'meadow', 'harbor', 'lagoon', 'glacier', 'volcano', 'falcon', 'eagle', 'owl', 'sparrow', 'robin', 'whale', 'dolphin', 'shark', 'octopus', 'butterfly', 'bee', 'maple', 'cedar', 'pine', 'bamboo', 'willow', 'oak', 'elm', 'rose', 'tulip', 'lily', 'iris', 'violet', 'anchor', 'basket', 'blanket', 'bucket', 'button', 'camera', 'candle', 'carpet', 'clock', 'compass', 'cushion', 'curtain', 'ladder', 'lamp', 'mirror', 'needle', 'pillow', 'pocket', 'ribbon', 'rope', 'saddle', 'hammer', 'anvil', 'baker', 'farmer', 'hunter', 'painter', 'singer', 'teacher', 'doctor', 'driver', 'writer', 'actor', 'artist', 'king', 'queen', 'prince', 'guard', 'knight', 'wizard', 'pirate', 'sailor', 'captain', 'soldier', 'monk', 'breakfast', 'lunch', 'dinner', 'picnic', 'snack', 'feast', 'bakery', 'cafe', 'diner', 'kitchen', 'pantry', 'cellar', 'bread', 'butter', 'cheese', 'egg', 'milk', 'rice', 'soup', 'salad', 'pasta', 'pizza', 'noodle', 'curry', 'stew', 'sugar', 'salt', 'pepper', 'honey', 'jam', 'cream', 'sauce', 'gravy', 'flour', 'yeast', 'dough', 'oven', 'stove', 'fork', 'knife', 'spoon', 'plate', 'bowl', 'cup', 'mug', 'kettle', 'teapot', 'napkin', 'tray', 'shirt', 'pants', 'dress', 'skirt', 'coat', 'jacket', 'hat', 'glove', 'scarf', 'boot', 'shoe', 'sock', 'belt', 'ring', 'chain', 'collar', 'sleeve', 'wool', 'linen', 'denim', 'velvet', 'head', 'eye', 'ear', 'nose', 'mouth', 'hand', 'foot', 'arm', 'leg', 'finger', 'toe', 'knee', 'elbow', 'heart', 'brain', 'bone', 'blood', 'skin', 'hair', 'face', 'neck', 'shoulder', 'chest', 'back', 'waist', 'skip', 'hop', 'spin', 'twist', 'bend', 'stretch', 'kick', 'throw', 'catch', 'push', 'pull', 'lift', 'carry', 'drop', 'shake', 'wave', 'nod', 'wink', 'frown', 'cry', 'big', 'small', 'tall', 'short', 'wide', 'narrow', 'thick', 'thin', 'heavy', 'light', 'strong', 'weak', 'fast', 'slow', 'hot', 'cold', 'warm', 'cool', 'dry', 'wet', 'soft', 'hard', 'rough', 'smooth', 'sharp', 'dull', 'dark', 'loud', 'proud', 'kind', 'brave', 'calm', 'eager', 'glad', 'merry', 'tender', 'honest', 'polite', 'early', 'late', 'soon', 'now', 'then', 'tonight', 'weekly', 'daily', 'yearly', 'always', 'often', 'never', 'above', 'below', 'under', 'over', 'near', 'far', 'inside', 'outside', 'between', 'behind', 'beside', 'beyond', 'hill', 'lake', 'pond', 'creek', 'brook', 'shore', 'beach', 'coast', 'cliff', 'cave', 'dome', 'arch', 'gate', 'path', 'road', 'street', 'lane', 'alley', 'highway', 'tunnel', 'dock', 'pier', 'port', 'bay', 'field', 'farm', 'ranch', 'barn', 'stable', 'fence', 'wall', 'roof', 'floor', 'stair', 'hall', 'room', 'town', 'state', 'country', 'world', 'land', 'sea', 'air', 'fire', 'water', 'earth', 'wind', 'flame', 'gold', 'copper', 'bronze', 'steel', 'tin', 'lead', 'zinc', 'jewel', 'gem', 'opal', 'jade', 'wolf', 'bear', 'deer', 'moose', 'bison', 'camel', 'donkey', 'goat', 'pig', 'cow', 'hen', 'duck', 'goose', 'frog', 'toad', 'snake', 'lizard', 'mouse', 'rat', 'bat', 'mole', 'otter', 'beaver', 'skunk', 'raccoon', 'ant', 'beetle', 'cricket', 'spider', 'worm', 'snail', 'slug', 'moth', 'wasp', 'hornet', 'dragonfly', 'ash', 'birch', 'fir', 'spruce', 'juniper', 'poplar', 'walnut', 'chestnut', 'almond', 'daisy', 'sunflower', 'lavender', 'poppy', 'daffodil', 'orchid', 'peony', 'azalea', 'carrot', 'potato', 'tomato', 'onion', 'garlic', 'ginger', 'cucumber', 'lettuce', 'spinach', 'bean', 'pea', 'corn'],MAX=30;
let history=[],current='',hidden=false,mode='random';
for(const ch of SYMBOLS){const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.value=ch;cb.checked=true;label.style.cssText='border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer';label.append(cb,document.createTextNode(' '+ch));$('symbolGrid').append(label)}
function chosenSymbols(){return [...$('symbolGrid').querySelectorAll('input:checked')].map(x=>x.value).join('')}
function validateSymbols(){const invalid=mode==='random'&&Number($('symbols').value)>0&&!chosenSymbols();$('symbolWarning').textContent=invalid?'記号を1種類以上選択してください。':'';$('generate').disabled=!!invalid}
$('symbolGrid').addEventListener('change',validateSymbols);
$('allSymbols').addEventListener('click',()=>{$('symbolGrid').querySelectorAll('input').forEach(x=>x.checked=true);validateSymbols()});
$('noSymbols').addEventListener('click',()=>{$('symbolGrid').querySelectorAll('input').forEach(x=>x.checked=false);validateSymbols()});
// 旧版が保存した履歴は読み込まず、可能なら端末から削除する。
try{localStorage.removeItem('password-generator-history-v2')}catch(e){}
function notify(s,type=''){ $('status').textContent=s;$('status').className='status'+(type?' '+type:'') }
function randomInt(n){if(!Number.isSafeInteger(n)||n<=0)throw Error('乱数の範囲が不正です');const buf=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(buf);v=buf[0]}while(v>=limit);return v%n}
function pick(chars){return chars[randomInt(chars.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function clamp(v,min,max,def){v=Number(v);return Number.isFinite(v)?Math.max(min,Math.min(max,Math.trunc(v))):def}
function sync(from){const len=clamp($('length').value,8,64,16);if(from==='lengthRange')$('length').value=$('lengthRange').value;else if(from==='length')$('lengthRange').value=len;const length=clamp($('length').value,8,64,16);$('length').value=length;$('lengthRange').value=length;
$('symbols').max=length;$('symbolsRange').max=length;
if(from==='symbolsRange')$('symbols').value=$('symbolsRange').value;
const n=clamp($('symbols').value,0,length,2);$('symbols').value=n;$('symbolsRange').value=n;$('symbolsHint').textContent='0〜'+length+'個（正確に指定）';validateSymbols();syncPresets()}

function syncPresets(){document.querySelectorAll('.presets button').forEach(button=>{button.setAttribute('aria-pressed',String(Number($(button.dataset.setting).value)===Number(button.dataset.value)))})}
for(const button of document.querySelectorAll('.presets button')){button.addEventListener('click',()=>{const field=button.dataset.setting;$(field).value=button.dataset.value;sync(field)})}

function renderCurrent(){ $('password').textContent=hidden?'●'.repeat(Math.min(current.length,32)):current;$('toggle').textContent=hidden?'表示':'隠す';$('toggle').setAttribute('aria-pressed',String(hidden));$('toggle').setAttribute('aria-label',hidden?'パスワードを表示する':'パスワードを隠す') }
function renderHistory(){const ul=$('history');ul.replaceChildren();$('count').textContent='('+history.length+'/'+MAX+'件)';if(!history.length){const li=document.createElement('li');li.className='empty';li.textContent='まだ履歴はありません';ul.append(li);return}history.forEach((pw,i)=>{const li=document.createElement('li'),code=document.createElement('code'),copy=document.createElement('button'),del=document.createElement('button');code.textContent=pw;copy.className='btn';copy.textContent='コピー';copy.setAttribute('aria-label','履歴'+(i+1)+'をコピー');copy.addEventListener('click',()=>copyPassword(pw));del.className='btn danger';del.textContent='削除';del.setAttribute('aria-label','履歴'+(i+1)+'を削除');del.addEventListener('click',()=>{history.splice(i,1);renderHistory();notify('履歴を1件削除しました')});li.append(code,copy,del);ul.append(li)})}
function generate(){try{sync();let bits;if(mode==='phrase'){const count=clamp($('wordCount').value,3,8,6);$('wordCount').value=count;$('wordRange').value=count;const sep=$('separator').value;const words=Array.from({length:count},()=>WORDS[randomInt(WORDS.length)]);current=words.join(sep);bits=count*Math.log2(WORDS.length);if($('phraseNumber').checked){current+=sep+String(randomInt(100)).padStart(2,'0');bits+=Math.log2(100)}}else{const len=Number($('length').value),n=Number($('symbols').value),a=[];const letters=$('noAmbig').checked?[...LETTERS].filter(c=>!AMBIG.includes(c)).join(''):LETTERS;for(let i=0;i<len-n;i++)a.push(pick(letters));const chosen=chosenSymbols();if(n>0&&!chosen){notify('使用する記号を選択してください','error');return}for(let i=0;i<n;i++)a.push(pick(chosen));current=shuffle(a).join('');bits=(len-n)*Math.log2(letters.length)+(n?n*Math.log2(chosen.length):0)}hidden=false;renderCurrent();$('strength').textContent='生成空間の目安 約'+Math.round(bits)+'ビット';history.unshift(current);history=history.slice(0,MAX);renderHistory();notify('新しいパスワードを生成し、履歴に追加しました');}catch(e){notify('生成に失敗しました。安全な接続で開いてください。','error')}}
async function copyPassword(value){try{if(!navigator.clipboard?.writeText)throw Error('Clipboard APIが利用できません');await navigator.clipboard.writeText(value);notify('コピーしました')}catch(e){notify('コピーできませんでした。HTTPSで開いてください。','error')}}
function setMode(next){mode=next;validateSymbols();$('randomSettings').hidden=mode!=='random';$('phraseSettings').hidden=mode!=='phrase';for(const [id,active] of [['modeRandom',mode==='random'],['modePhrase',mode==='phrase']]){$(id).classList.toggle('selected',active);$(id).setAttribute('aria-pressed',String(active))}generate()}$('modeRandom').addEventListener('click',()=>setMode('random'));$('modePhrase').addEventListener('click',()=>setMode('phrase'));$('wordRange').addEventListener('input',()=>{$('wordCount').value=$('wordRange').value});$('wordCount').addEventListener('change',()=>{const n=clamp($('wordCount').value,3,8,6);$('wordCount').value=n;$('wordRange').value=n});$('generate').addEventListener('click',generate);$('copy').addEventListener('click',()=>copyPassword(current));$('toggle').addEventListener('click',()=>{hidden=!hidden;renderCurrent()});
for(const id of ['length','lengthRange','symbols','symbolsRange'])$(id).addEventListener(id.endsWith('Range')?'input':'change',()=>sync(id));
$('clear').addEventListener('click',()=>{if(!history.length)return;if(confirm('このタブのパスワード履歴をすべて削除しますか？')){history=[];renderHistory();notify('履歴をすべて削除しました')}});
sync();renderHistory();generate();
})();
</script></body></html>
